# Cloudflare Workers configuration — authoritative for the git-connected builds.
# Build command is set in the dashboard: npm run build
# Deploy command is set in the dashboard: npx wrangler deploy
name = "thegreatshift"
compatibility_date = "2026-07-26"
# Serve the site at the free <name>.<account>.workers.dev URL. Without this the
# Worker deploys with no public route ("No URLs enabled" in the dashboard).
workers_dev = true

[assets]
directory = "./_site"
# Serve _site/404.html for unmatched paths. Default is "none", which returns a
# bare 404 with no page body.
not_found_handling = "404-page"
